apiVersion: v1
kind: Namespace
metadata:
  name: cauveris
  labels:
    app.kubernetes.io/name: cauveris
    app.kubernetes.io/part-of: cauveris-system
---
apiVersion: v1
kind: Secret
metadata:
  name: cauveris-nebius-credentials
  namespace: cauveris
type: Opaque
stringData:
  NEBIUS_API_KEY: "replace-with-your-real-nebius-token-factory-key"
  CAUVERIS_JWT_SECRET: "generate-a-secure-random-32-character-secret-key"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cauveris-config
  namespace: cauveris
data:
  CAUVERIS_NEBIUS_ENABLED: "true"
  CAUVERIS_NEBIUS_BASE_URL: "https://api.tokenfactory.nebius.com/v1"
  CAUVERIS_NEBIUS_MODEL_ID: "nvidia/Llama-3.1-Nemotron-70B-Instruct-HF"
  CAUVERIS_NEBIUS_REQUEST_TIMEOUT_SECONDS: "60.0"
  CAUVERIS_NEBIUS_MAX_RETRIES: "3"
  CAUVERIS_NEBIUS_MAX_CONCURRENT_REQUESTS: "4"
  CAUVERIS_NEBIUS_DAILY_BUDGET_LIMIT: "50.0"
  CAUVERIS_MODEL_PROVIDER_REQUIRED: "true"
  CAUVERIS_DEMO_MODE: "false"
  CAUVERIS_DEMO_AUTH: "false"
  CAUVERIS_STORAGE_PATH: "/data/storage"
  CAUVERIS_REPORT_STORE_PATH: "/data/reports"
  CAUVERIS_EVIDENCE_STORE_PATH: "/data/evidence"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cauveris-data
  namespace: cauveris
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cauveris-api
  namespace: cauveris
  labels:
    app.kubernetes.io/name: cauveris-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cauveris-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cauveris-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: cauveris/api:production
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cauveris-config
            - secretRef:
                name: cauveris-nebius-credentials
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          volumeMounts:
            - name: persistent-storage
              mountPath: /data
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: persistent-storage
          persistentVolumeClaim:
            claimName: cauveris-data
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cauveris-api
  namespace: cauveris
  labels:
    app.kubernetes.io/name: cauveris-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: cauveris-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cauveris-web
  namespace: cauveris
  labels:
    app.kubernetes.io/name: cauveris-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cauveris-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cauveris-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: web
          image: cauveris/web:production
          imagePullPolicy: IfNotPresent
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://cauveris-api:8000"
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: cauveris-web
  namespace: cauveris
  labels:
    app.kubernetes.io/name: cauveris-web
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/name: cauveris-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cauveris-ingress
  namespace: cauveris
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cauveris-api
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: cauveris-api
                port:
                  number: 8000
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: cauveris-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cauveris-web
                port:
                  number: 3000
