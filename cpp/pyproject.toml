[build-system]
requires = ["scikit-build-core", "pybind11", "cmake", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "cauveris-kernels"
version = "0.1.0"
description = "GPU-Accelerated Holographic Causal Kernels for Cauveris"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Cauveris Team"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "numpy>=1.24",
    "cupy-cuda12x>=13.0; platform_system != 'Darwin'",
]

[tool.scikit-build-core]
cmake.minimum-version = "3.18"
cmake.args = [
    "-DCMAKE_BUILD_TYPE=Release",
    "-DCMAKE_CUDA_ARCHITECTURES=native",
]

[tool.scikit-build-core.metadata]
license-file = "LICENSE"

[tool.setuptools.packages.find]
where = ["."]
include = ["cauveris_kernels*"]

[tool.pytest.ini_options]
testpaths = ["tests"]