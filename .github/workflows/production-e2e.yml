name: production-path-proof

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proof:
    name: Production Path Proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies from lockfile
        run: uv sync --frozen

      - name: Guard against runtime fixture imports
        run: uv run python scripts/check_runtime_fixture_imports.py

      - name: Create artifact directory
        run: mkdir -p e2e-artifacts

      - name: Run production path proof
        env:
          CAUVERIS_E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts
        run: uv run python scripts/run_production_e2e.py --keep --artifact-dir e2e-artifacts

      - name: Upload sanitized E2E artifacts on failure or completion
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-path-proof-logs
          path: e2e-artifacts
          retention-days: 7
