[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cauveris"
version = "0.1.0"
description = "Autonomous reality debugger for AI-powered robotic systems"
authors = [
    {name = "Cauveris Team"}
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "mcap>=0.0.10",
    "polars>=0.19.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "psutil>=5.9.0",
    "detect-secrets>=1.4.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
cauveris = "cauveris.main:main"

[tool.setuptools]
packages = ["cauveris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = [
    ".git",
    ".venv",
    "apps",
    "golden_incident",
    "incident-CAU-0001",
    "verification_workspace",
    "sandbox_workspace",
    "temp_ingestion",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "apps",
    "golden_incident",
    "incident-CAU-0001",
    "verification_workspace",
    "sandbox_workspace",
    "temp_ingestion",
    "cauveris.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = false
disable_error_code = ["var-annotated", "assignment", "arg-type", "list-item", "index", "union-attr"]